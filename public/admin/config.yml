# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: mssngr/gabriel-for-denver
  branch: main
  # No base_url, so sign-in goes through Netlify's OAuth provider, configured
  # under Site configuration → Access & security → OAuth.
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}>
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}>
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}>
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}>
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}>
logo:
  src: /favicon.svg
site_url: https://gabrielfordenver.com
# Uploads land in src/assets so Astro can optimize them, and entries reference
# them by the same root-relative path that image() resolves in content.config.ts.
media_folder: "/src/assets/images"
public_folder: "/src/assets/images"
media_libraries:
  default:
    config:
      # Decap slugified uploaded filenames; Sveltia leaves them alone unless
      # asked, and Astro's asset imports are happier without spaces.
      slugify_filename: true
output:
  # Sveltia writes empty values for optional fields by default, which the Zod
  # schemas in content.config.ts reject (e.g. endTime: "" is not a date).
  omit_empty_optional_fields: true
collections:
  - label: Pages
    name: pages
    files:
      - label: Home
        name: home
        file: src/content/pages/home.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Heading (Spanish), name: heading_es, widget: string }
          - { label: Content, name: content, widget: richtext }
          - { label: Content (Spanish), name: content_es, widget: richtext }
          - { label: Photo Alt Text, name: photoAltText, widget: string }
          - {
              label: Photo Alt Text (Spanish),
              name: photoAltText_es,
              widget: string,
            }
      - label: Issues
        name: issues
        file: src/content/pages/issues.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Heading (Spanish), name: heading_es, widget: string }
          - { label: Content, name: content, widget: richtext }
          - { label: Content (Spanish), name: content_es, widget: richtext }
          - { label: Photo Alt Text, name: photoAltText, widget: string }
          - {
              label: Photo Alt Text (Spanish),
              name: photoAltText_es,
              widget: string,
            }
      - label: Events
        name: events
        file: src/content/pages/events.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Heading (Spanish), name: heading_es, widget: string }
          - { label: Content, name: content, widget: richtext }
          - { label: Content (Spanish), name: content_es, widget: richtext }
          - { label: Photo Alt Text, name: photoAltText, widget: string }
          - {
              label: Photo Alt Text (Spanish),
              name: photoAltText_es,
              widget: string,
            }
      - label: Request
        name: request
        file: src/content/pages/request.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Heading (Spanish), name: heading_es, widget: string }
          - { label: Content, name: content, widget: richtext }
          - { label: Content (Spanish), name: content_es, widget: richtext }
          - { label: Photo Alt Text, name: photoAltText, widget: string }
          - {
              label: Photo Alt Text (Spanish),
              name: photoAltText_es,
              widget: string,
            }
      - label: Donate
        name: donate
        file: src/content/pages/donate.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Heading (Spanish), name: heading_es, widget: string }
          - { label: Content, name: content, widget: richtext }
          - { label: Content (Spanish), name: content_es, widget: richtext }
          - { label: Photo Alt Text, name: photoAltText, widget: string }
          - {
              label: Photo Alt Text (Spanish),
              name: photoAltText_es,
              widget: string,
            }
      - label: Volunteer
        name: volunteer
        file: src/content/pages/volunteer.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Heading (Spanish), name: heading_es, widget: string }
          - { label: Content, name: content, widget: richtext }
          - { label: Content (Spanish), name: content_es, widget: richtext }
          - { label: Photo Alt Text, name: photoAltText, widget: string }
          - {
              label: Photo Alt Text (Spanish),
              name: photoAltText_es,
              widget: string,
            }
      - label: Contact Me
        name: contact-me
        file: src/content/pages/contact-me.yml
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Heading (Spanish), name: heading_es, widget: string }
          - { label: Content, name: content, widget: richtext }
          - { label: Content (Spanish), name: content_es, widget: richtext }
          - { label: Photo Alt Text, name: photoAltText, widget: string }
          - {
              label: Photo Alt Text (Spanish),
              name: photoAltText_es,
              widget: string,
            }
  - label: Issues
    name: issues
    folder: src/content/issues
    extension: yml
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Title (Spanish), name: title_es, widget: string }
      - { label: Summary, name: summary, widget: richtext }
      - { label: Summary (Spanish), name: summary_es, widget: richtext }
      - { label: Intro, name: intro, widget: richtext }
      - { label: Intro (Spanish), name: intro_es, widget: richtext }
      - { label: Slug, name: slug, widget: string }
      - { label: Lucide Icon, name: lucideIcon, widget: string }
      - { label: Order, name: order, widget: number }
      - {
          label: Sub-Issues,
          name: subIssues,
          widget: list,
          fields:
            [
              { label: Title, name: title, widget: string },
              { label: Title (Spanish), name: title_es, widget: string },
              { label: Summary, name: summary, widget: richtext },
              { label: Summary (Spanish), name: summary_es, widget: richtext },
              {
                label: Problems & Solutions,
                name: problemsAndSolutions,
                widget: list,
                fields:
                  [
                    { label: Problem, name: problem, widget: richtext },
                    {
                      label: Problem (Spanish),
                      name: problem_es,
                      widget: richtext,
                    },
                    { label: Solution, name: solution, widget: richtext },
                    {
                      label: Solution (Spanish),
                      name: solution_es,
                      widget: richtext,
                    },
                  ],
              },
            ],
        }
  # The platform. Field Guides are the issue areas; Planks are the individual
  # promises, one file each. Deliberately separate from Issues above: nothing
  # here renders on the live site yet, so it is safe to write months ahead of
  # launch without touching what /issues shows today.
  - { divider: true, name: platform-divider }
  - label: Field Guides
    label_singular: Field Guide
    name: guides
    folder: src/content/guides
    extension: yml
    create: true
    icon: menu_book
    identifier_field: slug
    summary: "{{title}} — {{status}}"
    sortable_fields: [order, title, status]
    description: One issue area. The promises inside it live under Planks.
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Title (Spanish),
          name: title_es,
          widget: string,
          required: false,
        }
      - {
          label: Slug,
          name: slug,
          widget: string,
          hint: "Used in the URL: /platform/your-slug. Keep it identical to the
            filename.",
        }
      - {
          label: Stance,
          name: stance,
          widget: string,
          hint: The whole issue in one line. Wrap the key phrase in
            **double asterisks** to highlight it.,
        }
      - {
          label: Stance (Spanish),
          name: stance_es,
          widget: string,
          required: false,
        }
      - { label: Lucide Icon, name: lucideIcon, widget: string }
      - { label: Order, name: order, widget: number }
      - {
          label: Status,
          name: status,
          widget: select,
          options: [draft, published],
          default: draft,
          hint: Drafts are visible on the site only to someone with the link.
            Every Spanish field must be filled before this can be published.,
        }
      - { label: Artwork, name: artwork, widget: image, required: false }
      - {
          label: Artwork Alt Text,
          name: artworkAlt,
          widget: string,
          required: false,
        }
      - {
          label: Artwork Alt Text (Spanish),
          name: artworkAlt_es,
          widget: string,
          required: false,
        }
      - {
          label: Last Reviewed,
          name: lastReviewed,
          widget: datetime,
          required: false,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          hint: Shown on the page as "Updated ...". A platform page with no date
            reads as unmaintained.,
        }
      - {
          label: Related Guides,
          name: related,
          widget: list,
          required: false,
          summary: "{{fields.guide}} — {{fields.reason}}",
          hint: Cross-links shown at the foot of the page, each with an optional
            one-line reason. A reason with no Spanish version is left off the
            Spanish page rather than shown in English.,
          fields:
            [
              {
                label: Guide,
                name: guide,
                widget: relation,
                collection: guides,
                value_field: "{{fields.slug}}",
                display_fields: ["{{fields.title}} — {{fields.status}}"],
                search_fields: [title, slug],
              },
              {
                label: Reason,
                name: reason,
                widget: string,
                required: false,
                hint: 'e.g. "housing-first only works if there is housing"',
              },
              {
                label: Reason (Spanish),
                name: reason_es,
                widget: string,
                required: false,
              },
            ],
        }
      - {
          label: Meta Description,
          name: metaDescription,
          widget: text,
          required: false,
          hint: Falls back to the stance. Set it when the stance makes a poor
            search snippet.,
        }
      - {
          label: Meta Description (Spanish),
          name: metaDescription_es,
          widget: text,
          required: false,
        }
  - label: Planks
    label_singular: Plank
    name: planks
    folder: src/content/planks
    extension: yml
    create: true
    icon: flag
    identifier_field: slug
    summary: "{{commitment}}"
    sortable_fields: [order, slug, status]
    view_groups:
      - { label: Field Guide, field: guide }
      - { label: Status, field: status }
    description: One promise = one band on a Field Guide page.
    fields:
      # `{{fields.slug}}` is the guide's slug FIELD. `{{slug}}` would be the
      # entry slug — the filename — which is the coupling this join exists to
      # avoid. See docs/proposals/2026-09-13-platform-field-guide/ (Spike S1).
      - {
          label: Field Guide,
          name: guide,
          widget: relation,
          collection: guides,
          value_field: "{{fields.slug}}",
          display_fields: ["{{fields.title}} — {{fields.status}}"],
          search_fields: [title, slug],
          hint: Which guide this promise belongs to.,
        }
      - {
          label: Slug,
          name: slug,
          widget: string,
          hint: "Short and stable — it is the permalink: #plank-your-slug. Not
            the whole sentence.",
        }
      - {
          label: Order,
          name: order,
          widget: number,
          hint: Position within its guide.,
        }
      - {
          label: Status,
          name: status,
          widget: select,
          options: [draft, published],
          default: draft,
          hint: Per plank, so a guide can go live with three promises while two
            more are still being written.,
        }
      - {
          label: Kicker,
          name: kicker,
          widget: string,
          required: false,
          hint: 'Sub-topic shown above the hero, e.g. "Zoning".',
        }
      - {
          label: Kicker (Spanish),
          name: kicker_es,
          widget: string,
          required: false,
        }
      - {
          label: Statistic,
          name: statValue,
          widget: string,
          required: false,
          hint: 'The giant figure. Any form works: "77%", "1 in 3", "$1.2B".
            Leave blank to use a pull-quote instead.',
        }
      - {
          label: Statistic Caption,
          name: statCaption,
          widget: text,
          required: false,
          hint: What the figure counts. A number with no caption is a rumour.,
        }
      - {
          label: Statistic Caption (Spanish),
          name: statCaption_es,
          widget: text,
          required: false,
        }
      - {
          label: Pull Quote,
          name: pullQuote,
          widget: text,
          required: false,
          hint: Used as the hero only when there is no statistic.,
        }
      - {
          label: Pull Quote (Spanish),
          name: pullQuote_es,
          widget: text,
          required: false,
        }
      - {
          label: Commitment,
          name: commitment,
          widget: text,
          hint: The promise, written as a verb phrase. "Legalize...", not
            "Housing should be...".,
        }
      - {
          label: Commitment (Spanish),
          name: commitment_es,
          widget: text,
          required: false,
        }
      - {
          label: Why,
          name: why,
          widget: text,
          hint: One sentence of justification, always visible on the band. This
            is what keeps the closed detail panel from hiding the argument.,
        }
      - { label: Why (Spanish), name: why_es, widget: text, required: false }
      - {
          label: Detail,
          name: detail,
          widget: richtext,
          required: false,
          hint: The prose behind "Read the policy".,
        }
      - {
          label: Detail (Spanish),
          name: detail_es,
          widget: richtext,
          required: false,
        }
      - {
          label: What Council Can Do,
          name: authority,
          widget: text,
          required: false,
          hint: 'e.g. "A zoning text amendment — a Council vote, no ballot
            measure required." This is the field that separates a platform from
            a wish list.',
        }
      - {
          label: What Council Can Do (Spanish),
          name: authority_es,
          widget: text,
          required: false,
        }
      - {
          label: Timeline,
          name: timeline,
          widget: select,
          required: false,
          options: [day-one, first-budget, ordinance, ballot-referral, ongoing],
        }
      - {
          label: Sources,
          name: sources,
          widget: list,
          required: false,
          summary: "{{fields.label}}",
          fields:
            [
              { label: Label, name: label, widget: string },
              {
                label: Label (Spanish),
                name: label_es,
                widget: string,
                required: false,
              },
              {
                label: URL,
                name: url,
                widget: string,
                pattern:
                  ["^https?://", "Include the https:// at the front."],
              },
            ],
        }
      - {
          label: Band Theme,
          name: theme,
          widget: select,
          required: false,
          options: [ink, sky, gold, paper],
          hint: Leave blank to use the automatic rotation. Only set this to fix
            a specific band that clashes with its neighbour.,
        }
  - label: Posts
    name: posts
    folder: src/content/posts
    extension: yml
    create: true
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Title (Spanish), name: title_es, widget: string }
      - {
          label: Slug,
          name: slug,
          widget: string,
          hint: "Used in the URL: /posts/your-slug",
        }
      - {
          label: Date,
          name: date,
          widget: datetime,
          type: date,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          default: "{{now}}",
        }
      - { label: Intro, name: intro, widget: richtext }
      - { label: Intro (Spanish), name: intro_es, widget: richtext }
      - { label: Content, name: content, widget: richtext }
      - { label: Content (Spanish), name: content_es, widget: richtext }
      - { label: Photo, name: photo, widget: image }
      - { label: Photo Alt Text, name: photoAlt, widget: string }
      - {
          label: Photo Alt Text (Spanish),
          name: photoAlt_es,
          widget: string,
        }
  - label: Events
    name: events
    folder: src/content/events
    extension: yml
    create: true
    identifier_field: title
    summary: "{{title}} — {{startTime}}"
    sortable_fields: [startTime, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Title (Spanish), name: title_es, widget: string }
      - { label: Location, name: location, widget: string }
      - {
          label: Address,
          name: address,
          widget: string,
          required: false,
          hint: "Street address, linked to Google Maps. Leave blank to hide it.",
        }
      - {
          label: Start Time,
          name: startTime,
          widget: datetime,
          default: "{{now}}",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "M/D/YY",
          time_format: "h:mma",
          picker_utc: false,
        }
      - {
          label: End Time,
          name: endTime,
          widget: datetime,
          required: false,
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "M/D/YY",
          time_format: "h:mma",
          picker_utc: false,
          hint: Shown on the event and used for calendar invites. Defaults to 2
            hours after the start time.,
        }
      - { label: Description, name: description, widget: richtext }
      - { label: Description (Spanish), name: description_es, widget: richtext }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt Text, name: imageAlt, widget: string }
      - {
          label: Image Alt Text (Spanish),
          name: imageAlt_es,
          widget: string,
        }
