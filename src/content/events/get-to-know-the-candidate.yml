title: Get to Know the Candidate
title_es: ¡Conoce al candidato!
location: Cameron Church
address: 1600 S Pearl St, Denver, CO 80210
startTime: 2026-08-09T11:00:00-05:00
endTime: 2026-08-09T13:00:00-05:00
description: Come meet Gabriel Konkle, a Denverite fighting for other families here in Denver to have the housing, food, childcare, privacy and more that we all need and deserve. You'll have the chance to hear a bit from him before we open the floor to you for questions. This campaign is a job interview! So put us to the test and ask the questions that matter most to you. We will have a light spread of food and drinks available, and will socialize after our Q&A time. Let's normalize having real, down to earth conversations with the people who will represent us.
description_es: Ven a conocer a Gabriel Konkle, un residente de Denver que lucha para que otras familias de la ciudad cuenten con vivienda, alimentos, servicios de cuidado infantil, privacidad y todo lo demás que todos necesitamos y merecemos. Tendrás la oportunidad de escucharlo hablar un poco antes de abrir el espacio para tus preguntas. ¡Esta campaña es como una entrevista de trabajo! Así que ponnos a prueba y haz las preguntas que más te importen. Ofreceremos un refrigerio ligero y bebidas, y podremos socializar después de la sesión de preguntas y respuestas. Normalicemos el tener conversaciones auténticas y cercanas con las personas que nos representarán.
