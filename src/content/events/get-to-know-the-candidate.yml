title: Get to Know the Candidate
title_es: ¡Conoce al candidato!
location: Cameron Church
address: 1600 S Pearl St, Denver, CO 80210
startTime: 2026-08-09T13:30:00-04:00
endTime: 2026-08-09T14:00:00-05:00
description: Come meet me, a Denverite fighting for other families here in Denver to have the housing, food, childcare, privacy and more that we all need and deserve. I'll share a bit about myself before opening the floor up to you for questions. This campaign is a job interview! So put me to the test and ask the questions that matter most to you. We will have a light spread of food and drinks available, and will socialize after our Q&A time. Let's normalize having real, down to earth conversations with the people who will represent us.
description_es: 'Vengan a conocerme: soy un residente de Denver que lucha para que otras familias de la ciudad tengan acceso a vivienda, alimentos, cuidado infantil, privacidad y todo lo demás que todos necesitamos y merecemos. Les contaré un poco sobre mí antes de abrir el espacio para sus preguntas. ¡Esta campaña es como una entrevista de trabajo! Así que pónganme a prueba y hagan las preguntas que más les importen. Ofreceremos un refrigerio ligero y bebidas, y podremos conversar después de la sesión de preguntas y respuestas. Normalicemos el tener conversaciones auténticas y cercanas con las personas que nos representarán.'
