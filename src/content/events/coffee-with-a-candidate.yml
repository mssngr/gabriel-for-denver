description: Come have coffee with me! Grab a drink or a sweet treat and pull up a chair. If you have a concern about Denver, a question about me and my campaign, or an idea you want heard come let me know about it. I want to serve YOU so my first order of business is hearing directly FROM you. No need to make an appointment, just join my table for 15 minutes.
description_es: ¡Ven a tomar un café conmigo! Pide una bebida o algo dulce y siéntate a la mesa. Si te preocupa algo relacionado con Denver, tienes alguna pregunta sobre mí y mi campaña, o alguna idea que quieras compartir, ven a contármelo. Quiero servirte a TI, así que mi prioridad es escucharte directamente. No hace falta cita previa; simplemente acompáñame en la mesa durante 15 minutos.
