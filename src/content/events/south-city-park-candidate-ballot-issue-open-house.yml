description: All candidates on the ballot for the At-Large B seat, and groups backing or opposing ballot initiatives on the November 2026 ballot have been invited to this event to meet with neighbors and share their perspectives and plans in a meet & greet (not a panel or presentation) format.
description_es: Todos los candidatos en la boleta para el cargo general B (At-Large B), así como los grupos a favor o en contra de las iniciativas de ley para la boleta de noviembre de 2026, han sido invitados a este evento para reunirse con los vecinos y compartir sus perspectivas y planes en un formato de convivencia y diálogo (no un panel ni una presentación).
