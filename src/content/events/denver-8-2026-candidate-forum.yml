title: Denver 8 2026 Candidate Forum
title_es: Denver 8 2026 Candidate Forum
location: University of Denver
address: 2199 S University Blvd, Denver, CO 80208
startTime: 2026-10-03T10:00:00-06:00
description: |-
  The Denver Decides community partnership, composed of the League of Women Voters of Denver and Inter-Neighborhood Cooperation, is pleased to invite you to participate in our **2026 Candidate Programming** designed to educate the public and generate excitement for getting out the vote in anticipation of the General Election on November 3, 2026.

  The Candidate Forum will be live-streamed in front of an audience.  The video and candidate information will then be available to the public via **Denver 8 TV**, Denver’s municipal cable television station, and **online** on the Denver Decides website, [www.DenverDecides.org](http://www.denverdecides.org/).
description_es: |-
  La alianza comunitaria Denver Decides, compuesta por la Liga de Mujeres Votantes de Denver y la Cooperación Intervecinal, se complace en invitarle a participar en nuestra **Programación para Candidatos 2026**, diseñada para educar al público y generar entusiasmo para promover el voto de cara a las Elecciones Generales del 3 de noviembre de 2026.

  El Foro de Candidatos se transmitirá en vivo ante el público presente. El video y la información de los candidatos estarán disponibles para la ciudadanía a través de **Denver 8 TV**, el canal de televisión por cable municipal de Denver, y en línea en el sitio web de Denver Decides, [www.DenverDecides.org](www.DenverDecides.org).
