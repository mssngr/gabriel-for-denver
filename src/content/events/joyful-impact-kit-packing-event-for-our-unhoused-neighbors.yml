title: Joyful Impact - Kit Packing Event for our Unhoused Neighbors
title_es: 'Impacto de Alegría: Evento de preparación de paquetes para nuestros vecinos sin hogar'
location: Chain Reaction Brewing
address: 902 South Lipan Street  Denver, CO 80223
startTime: 2026-08-16T13:00:00-05:00
endTime: 2026-08-16T15:00:00-05:00
description: |-
  Come pack kits for our unhoused neighbors with us! This is not a campaign event, but a community one to provide something tangible for when we see neighbors in need. At the end we will each walk away with bags to share in our community. **You can show up as you are and help pack kits with no obligations.** You can also bring something to add to the kits.

  A short list of things to keep in mind if you want to contribute:

  - 20+ of each item
  - Clean and sanitary
  - Minimal packaging where possible
  - Reusable and sustainable options where possible
  - Consider common allergies
  - Types of items: snacks, toiletries, socks or underwear in various sizes, drinks, sunscreen, small toys or books for kids, writing and reading materials, hand fans, comfort items, gift cards, etc.

  A little over a year ago now my wife Micala and I started a mutual aid and political action group called Joyful Impact. If you'd like to join us you can attend an event like this one and/or join the Facebook page.
description_es: |-
  ¡Ven a preparar paquetes de ayuda con nosotros para nuestros vecinos sin hogar! No se trata de un evento de campaña política, sino de una iniciativa comunitaria para ofrecer algo tangible cuando nos encontremos con vecinos que lo necesiten. Al finalizar, cada uno se llevará paquetes para repartir en su propia comunidad. Puedes venir tal como eres y ayudar a preparar los paquetes sin ningún compromiso; también puedes traer artículos para añadirlos a ellos.

  Aquí tienes una breve lista de aspectos a tener en cuenta si deseas contribuir:

  - Más de 20 unidades de cada artículo
  - Artículos limpios y en buen estado
  - Envases mínimos, siempre que sea posible
  - Opciones reutilizables y sostenibles, siempre que sea posible
  - Considerar las alergias más comunes
  - Tipos de artículos: aperitivos, artículos de aseo personal, calcetines o ropa interior de diversas tallas, bebidas, protector solar, juguetes pequeños o libros para niños, material de lectura y escritura, abanicos de mano, artículos de confort, tarjetas de regalo, etc.

  Hace poco más de un año, mi esposa Micala y yo fundamos un grupo de ayuda mutua y acción política llamado Joyful Impact. Si te gustaría unirte a nosotros, puedes asistir a un evento como este o unirte a nuestra página de Facebook.
