title: Joyful Impact - Kit Packing Event for our Unhoused Neighbors
title_es: 'Impacto de Alegría: Evento de preparación de paquetes para nuestros vecinos sin hogar'
location: Chain Reaction Brewing
address: 902 South Lipan Street  Denver, CO 80223
startTime: 2026-08-16T13:00:00-05:00
endTime: 2026-08-16T15:00:00-05:00
description: |-
  Come pack kits for our unhoused neighbors with us! This is not a campaign event, but a community one. We wanted to provide something tangible and useful for when we see our neighbors in need. At the end we will each walk away with around 5 bags to personally hand to someone who could use them in our community. You can show up as you are and help pack kits with no obligations. You can also bring something to add to the kits.

  A short list of things to keep in mind if you want to contribute:

  20+ of each item

  Clean and sanitary

  Minimal packaging where possible

  Reusable and sustainable options where possible

  Consider common allergies

  Types of items: snacks, toiletries, socks or underwear in various sizes, drinks, sunscreen, small toys or books for kids, writing and reading materials, hand fans, comfort items, gift cards, etc.

  A little over a year ago now my wife Micala and I started a mutual aid and political action group called Joyful Impact. Our goal then was to reach out to and connect with our neighborhood, build strong ties and independent support networks outside of capitalism and traditional governmental pathways, share skills, tackle projects bigger than any of us could do individually, and cultivate individual and communal joy. In the time since we've become close with our neighbors and local businesses, fostered strong friendships, given and received support, and held some really great events. If you'd like to join us you can attend an event like this one and/or join the Facebook page.
description_es: |-
  ¡Ven a preparar paquetes de ayuda con nosotros para nuestros vecinos sin hogar! Este no es un evento de campaña política, sino una iniciativa comunitaria. Queríamos ofrecer algo tangible y útil para cuando nos encontremos con vecinos que lo necesiten. Al finalizar, cada participante se llevará unas 5 bolsas para entregarlas personalmente a personas de nuestra comunidad que puedan aprovecharlas. Puedes venir tal como eres y ayudar a preparar los paquetes sin ningún compromiso; también puedes traer artículos para añadirlos a los kits.

  Aquí tienes una breve lista de aspectos a tener en cuenta si deseas contribuir:

  Más de 20 unidades de cada artículo

  Artículos limpios y en buen estado

  Embalaje mínimo, siempre que sea posible

  Opciones reutilizables y sostenibles, siempre que sea posible

  Considerar las alergias comunes

  Tipos de artículos: aperitivos, artículos de aseo personal, calcetines o ropa interior de diversas tallas, bebidas, protector solar, juguetes pequeños o libros para niños, material de lectura y escritura, abanicos de mano, artículos de confort, tarjetas de regalo, etc.

  Hace poco más de un año, mi esposa Micala y yo fundamos un grupo de apoyo mutuo y acción política llamado \*Joyful Impact\*. Nuestro objetivo era acercarnos a nuestro vecindario y conectar con él, crear vínculos sólidos y redes de apoyo independientes —al margen del capitalismo y de las vías gubernamentales tradicionales—, compartir habilidades, emprender proyectos de mayor envergadura de lo que cualquiera de nosotros podría lograr por sí solo, y cultivar la alegría tanto individual como colectiva. Desde entonces, hemos estrechado lazos con vecinos y negocios locales, forjado grandes amistades, dado y recibido apoyo, y organizado eventos fantásticos. Si quieres unirte a nosotros, puedes asistir a eventos como este o unirte a nuestra página de Facebook.
