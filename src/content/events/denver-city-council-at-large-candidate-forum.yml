title: Denver City Council At-Large Candidate Forum
title_es: Denver City Council At-Large Candidate Forum
location: Swansea Neighborhood
startTime: 2026-10-15T18:00:00-06:00
endTime: 2026-10-15T20:00:00-06:00
description: |-
  The forum will bring together residents of Globeville, Elyria, and Swansea and community members from across Denver to hear directly from the candidates seeking Denver’s open At-Large City Council seat in the November 2026 election.

  The discussion will focus on three major issues with significant implications for our neighborhoods and the broader city:

  - **Data centers**, including Denver’s current moratorium, future regulation, environmental and utility impacts, and the proposed CoreSite expansion in Elyria;
  - **The Triangle/National Western public land**, including community ownership, affordable housing, development, and community benefits on this major publicly owned site; and
  - **Surveillance**, including privacy, civil liberties, accountability, and Denver’s use of surveillance technologies such as Flock cameras.
description_es: |-
  El foro reunirá a residentes de Globeville, Elyria y Swansea, así como a miembros de la comunidad de todo Denver, para escuchar directamente a los candidatos que buscan ocupar el escaño vacante al Concejo Municipal At-Large de Denver en las elecciones de noviembre de 2026.

  La discusión se centrará en tres temas principales con implicaciones significativas para nuestros vecindarios y toda la ciudad:

  - **Centros de datos:** incluyendo la moratoria actual de Denver, regulaciones futuras, impactos ambientales y en los servicios públicos, y la propuesta de expansión de CoreSite en Elyria;
  - **Los terrenos públicos de The Triangle/National Western:** incluyendo la propiedad comunitaria, vivienda accesible, desarrollo y beneficios comunitarios en este importante predio de propiedad pública; y
  - **Vigilancia:** incluyendo privacidad, libertades civiles, rendición de cuentas y el uso de tecnologías de vigilancia por parte de Denver, tales como las cámaras Flock.
