description: I'm attending Drinking Liberally to hear Matthew Logan from YIMBY Denver talk about housing supply and affordable, accessible housing. Subjects near and dear to my heart. Join me and pepper him with some questions, too!
description_es: Voy a ir a **Drinking Liberally** para escuchar a Matthew Logan, de YIMBY Denver, hablar sobre la oferta de vivienda y la vivienda asequible y accesible. Son temas muy cercanos a mi corazón. ¡Acompáñenme y aprovechen para hacerle varias preguntas también!
