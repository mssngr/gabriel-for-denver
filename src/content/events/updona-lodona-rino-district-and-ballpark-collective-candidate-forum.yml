title: UpDoNA, LoDoNA, RiNo District, and Ballpark Collective Candidate Forum
title_es: UpDoNA, LoDoNA, RiNo District, and Ballpark Collective Candidate Forum
location: Downtown
startTime: 2026-09-24T18:00:00-06:00
description: Coordinated with the Clerk and Recorder's office, UpDoNA, LoDoNA, RiNo District, and Ballpark Collective is holding a Candidate Forum to hear from City Council At Large B candidates. Candidates will address the entire group about a few topics particularly important to Downtown Denver. Then everyone splits up to discuss those topics in more detail. It will be at a Downtown or Ballpark or Curtis Park location to be determined.
description_es: En coordinación con la Oficina del Registro y Notaría (Clerk and Recorder), UpDoNA, LoDoNA, el Distrito RiNo y Ballpark Collective llevarán a cabo un Foro de Candidatos para escuchar a los postulantes al Concejo Municipal At-Large B. Los candidatos se dirigirán a todo el grupo sobre algunos temas de especial importancia para el centro de Denver (Downtown). Después, la audiencia se dividirá en grupos para discutir esos temas con mayor detalle. El evento se realizará en una ubicación por determinar dentro de Downtown, Ballpark o Curtis Park.
