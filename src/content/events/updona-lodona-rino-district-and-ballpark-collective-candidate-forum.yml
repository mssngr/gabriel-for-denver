title: UpDoNA, LoDoNA, RiNo District, and Ballpark Collective Candidate Forum
title_es: UpDoNA, LoDoNA, RiNo District, and Ballpark Collective Candidate Forum
location: Colorado Convention Center
address: 700 14th St, Denver, CO 80202
startTime: 2026-09-24T18:00:00-06:00
endTime: 2026-09-24T20:00:00-06:00
description: |-
  Coordinated with the Clerk and Recorder's office, UpDoNA, LoDoNA, RiNo District, and Ballpark Collective is holding a Candidate Forum to hear from City Council At Large B candidates. Candidates will address the entire group about a few topics particularly important to Downtown Denver. Then everyone splits up to discuss those topics in more detail.

  SIGN UP HERE: [https://www.eventbrite.com/e/denver-city-council-at-large-candidate-forum-tickets-2000218423148](https://www.eventbrite.com/e/denver-city-council-at-large-candidate-forum-tickets-2000218423148)

  We will have water only. We hope you and every attendee comes well nourished. 

  It will be hosted by Michael Spencer of CBS Colorado channel 4.
description_es: En coordinación con la Oficina del Registro y Notaría (Clerk and Recorder), UpDoNA, LoDoNA, el Distrito RiNo y Ballpark Collective llevarán a cabo un Foro de Candidatos para escuchar a los postulantes al Concejo Municipal At-Large B. Los candidatos se dirigirán a todo el grupo sobre algunos temas de especial importancia para el centro de Denver (Downtown). Después, la audiencia se dividirá en grupos para discutir esos temas con mayor detalle. El evento se realizará en una ubicación por determinar dentro de Downtown, Ballpark o Curtis Park.
