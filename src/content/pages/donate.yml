heading: Support us
heading_es: Apóyanos
content: |-
  If you are a Denver resident, **the first $50 of your donation is matched 900%** by the city! This is because of the [Fair Elections Fund](https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Denver-Clerk-and-Recorder/Fair-Elections-Fund), an effort to get "big money" out of politics.

  **I need just 100 donations** from Denverites to unlock these funds from the city. It will be _crucial_ to being able to fund this campaign and have a chance this November. If you believe in what I'm doing, help me make our voice matter!
content_es: |-
  Si eres residente de Denver, **¡los primeros $50 dólares de tu donación tienen un fondo equivalente del 900%** por parte de la ciudad! Esto se debe al [Fair Elections Fund](https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Denver-Clerk-and-Recorder/Fair-Elections-Fund), un esfuerzo para sacar el 'dinero de los grandes intereses' de la política.

  **Necesito solo 100 donaciones** de habitantes de Denver para desbloquear estos fondos de la ciudad. Será _fundamental_ para poder financiar esta campaña y tener una oportunidad este noviembre. Si crees en lo que estoy haciendo, ¡ayúdame a hacer que nuestra voz importe!
