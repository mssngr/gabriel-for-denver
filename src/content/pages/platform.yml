heading: Everything I'd do in office
heading_es: Todo lo que haría en el cargo
content: >-
  Most candidates tell you what they care about. I'd rather tell you **exactly
  what I'll do about it.**\

  \

  Every promise below is one you can hold me to. They're grouped by the issue they answer, and each guide lays out the reasoning, the receipts, and when I'd move on it.
content_es: >-
  La mayoría de los candidatos te dicen lo que les importa. Yo prefiero decirte
  **exactamente qué voy a hacer al respecto.**\

  \

  Cada promesa aquí abajo es una por la que me puedes responsabilizar. Están agrupadas por el tema que responden, y cada guía explica el razonamiento, las fuentes y cuándo actuaría.
