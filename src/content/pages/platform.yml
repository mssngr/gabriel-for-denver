heading: Everything I'll do in office
heading_es: Todo lo que haré en el cargo
content: |-
  Most candidates tell you what they care about. I'd rather tell you **exactly what I'll do.**

  Every action below is one you can hold me to. They're grouped by the issue they answer, and each guide lays out the reasoning, my solution, and when I'd move on it.
content_es: |-
  La mayoría de los candidatos te dicen lo que les importa. Prefiero decirte **exactamente lo que haré.**

  Cada promesa a continuación es una que puedes exigirnos cumplir. Están agrupadas según el problema que responden, y cada guía detalla el razonamiento, mi solución y cuándo actuaré al respecto.
