heading: My name is **Gabriel Konkle.** And it's time for change!
heading_es: Me llamo **Gabriel Konkle.** ¡Y es hora de cambiar!
content: It's up to us to **end AI surveillance,** to protect our water from data centers, to **demand affordable rent,** to create parks that feed our city with food forests and urban gardens, and to provide **free preschool for all.** I believe the time is now. We can build the city of our dreams, together!
content_es: Nos toca a nosotros **poner fin a la vigilancia por IA,** proteger nuestra agua de los centros de datos, **exigir rentas accesibles,** crear parques que alimenten a nuestra ciudad con bosques comestibles y huertos urbanos, y brindar **preescolar gratuito para todos.** Creo que el momento es ahora. ¡Podemos construir la ciudad de nuestros sueños, juntos!
