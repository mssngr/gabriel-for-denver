heading: My name is **Gabriel Konkle.** And it's time for change.
heading_es: Me llamo **Gabriel Konkle.** Y es hora de cambiar.
content: It's up to us to **end AI surveillance,** to protect our water from data centers, to **demand affordable rent,** to invest in **free preschool,** and to create a parks system that feeds us, body and soul. I believe the time is now. We can build the city of our dreams, together!
content_es: Nos toca a nosotros poner **fin a la vigilancia por IA,** proteger nuestra agua de los centros de datos, **exigir rentas accesibles,** invertir en **preescolar gratuito** y crear un sistema de parques que nos alimente, en cuerpo y alma. Creo que el momento es ahora. ¡Podemos construir la ciudad de nuestros sueños, juntos!
photoAltText: Photo of Gabriel standing in front of Denver
photoAltText_es: Foto de Gabriel de pie frente a Denver
