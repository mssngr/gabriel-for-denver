slug: 2i
code: 2I
title: Two-year Budget Process for Denver
title_es: Proceso de presupuesto de dos años para Denver
section: local
order: 2
stance: 'yes'
what: Lets the Mayor and City Council adopt a **2-year budget process** instead of the current 1-year process. It also modernizes/repeals some Charter sections surrounding this.
what_es: Permite que el alcalde y el Concejo Municipal adopten un **proceso de presupuesto de 2 años** en lugar del actual proceso de 1 año. También moderniza o deroga algunas secciones de la Carta relacionadas con esto.
why: It allows city leadership to plan further ahead, involve community feedback, and it doesn’t lock in (can revert back to 1-year when necessary.)
why_es: Permite que los líderes de la ciudad planifiquen con más anticipación, incorporen la opinión de la comunidad, y no es definitivo (se puede volver al proceso de 1 año cuando sea necesario).
status: published
