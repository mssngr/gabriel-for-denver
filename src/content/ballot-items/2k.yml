title: Franchise Agreement with Xcel Energy
title_es: Acuerdo de franquicia con Xcel Energy
section: local
order: 4
stance: 'no'
what: '**20 year agreement** to give Xcel public rights-of-way for the city. Extra $34 million to Denver’s general budget and $125k per year for the income-qualified energy assistance program.'
what_es: '**Acuerdo de 20 años** para dar a Xcel derechos de paso públicos en la ciudad. $34 millones adicionales para el presupuesto general de Denver y $125 mil al año para el programa de asistencia energética para personas con ingresos calificados.'
why: |-
  - Working group asked for $5 million per year for energy assistance program, not $5 million over 20 years. (CEO makes $16 million per year.)
  - This locks the status quo for 20 years, wasting our leverage.
  - Rejection keeps the existing agreement’s terms.
why_es: |-
  - El grupo de trabajo pidió $5 millones al año para el programa de asistencia energética, no $5 millones en 20 años. (El director ejecutivo gana $16 millones al año.)
  - Esto fija el statu quo por 20 años y desperdicia nuestra influencia.
  - Rechazarlo mantiene los términos del acuerdo actual.
