slug: '137'
code: '137'
title: Sporting Goods Tax Exemption
title_es: Exención del impuesto a artículos deportivos
section: propositions
order: 7
stance: no
what: Exempts sales tax for sporting goods from going into the General Fund and locks it for conservation efforts, only. Planned conservation is forest thinning efforts.
what_es: Exenta el impuesto a las ventas de artículos deportivos de ir al Fondo General y lo destina exclusivamente a esfuerzos de conservación. La conservación planificada consiste en labores de raleo de bosques.
why: This one is tricky. There are environmentally aligned groups on both sides of this issue. I think taxes from buying guns should go towards the general fund, though, not only for conservation.
why_es: Esto es complicado. Hay grupos alineados con el medio ambiente en ambos lados de este tema. Sin embargo, creo que los impuestos por la compra de armas deberían destinarse al fondo general, y no solo a la conservación.
status: published
