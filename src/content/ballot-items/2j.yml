title: Modernizing the Civil Service Commission
title_es: Modernización de la Comisión de Servicio Civil
section: local
order: 3
stance: 'yes'
what: The Civil Service Commission (CSC) handles **hiring, promotions, and disciplinary appeals** for Denver police and fire personnel. Updates would make language gender-neutral and extend disciplinary timelines among other things.
what_es: La Comisión de Servicio Civil (CSC) se encarga de **las contrataciones, los ascensos y las apelaciones disciplinarias** del personal de policía y bomberos de Denver. Los cambios harían que el lenguaje sea neutral en cuanto al género y extenderían los plazos disciplinarios, entre otras cosas.
why: There’s no opposition to this measure. All positives, here!
why_es: No hay oposición a esta medida. ¡Todo es positivo aquí!
