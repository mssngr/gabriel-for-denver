slug: '85'
code: '85'
title: Plain Language Ballot Question
title_es: Lenguaje sencillo en las preguntas de la boleta
section: amendments
order: 5
stance: 'no'
what: Requires ballot questions use “plain language” at no more than an 8th grade level.
what_es: Exige que las preguntas de la boleta usen “lenguaje sencillo” de no más de un nivel de 8.º grado.
why: '**“Wolf in sheep’s clothing.”** We already added an accessible language standard. This would prevent showing things like income bracket effects.'
why_es: '**“Lobo con piel de oveja.”** Ya agregamos un estándar de lenguaje accesible. Esto impediría mostrar cosas como los efectos por tramo de ingresos.'
status: published
