title: Male and Female School Sports
title_es: Deportes escolares masculinos y femeninos
section: propositions
order: 4
stance: 'no'
what: Require school teams be labelled “Male,” “Female,” or “Co-Ed” and **bans any student** from joining a team that does **not align** with the **gender assigned at birth.**
what_es: Exige que los equipos escolares se identifiquen como “masculino”, “femenino” o “mixto” y **prohíbe a cualquier estudiante** unirse a un equipo que **no coincida** con el **género asignado al nacer.**
why: We’ve been here, before. Where are we, Texas? Florida? This isn’t professional sports! **There’s no debate!** My son is in DPS. None of them care! We don’t align with bigots.
why_es: Ya hemos estado aquí. ¿Dónde estamos, en Texas? ¿En Florida? ¡Esto no es deporte profesional! **¡No hay debate!** Mi hijo está en DPS. ¡A ninguno de ellos le importa! No nos alineamos con los intolerantes.
