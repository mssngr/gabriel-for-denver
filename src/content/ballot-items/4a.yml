what: A Mill Levy Override (MLO) is an **increase of** a previously approved **property tax.** This one is for teacher raises, career growth, student mental health, and special education.
what_es: Un Mill Levy Override (MLO) es un **aumento de** un **impuesto predial** aprobado previamente. Este es para aumentos salariales de maestros, desarrollo profesional, salud mental estudiantil y educación especial.
why: Will cost the average home-owner **$72 a year** while providing a base **$1,750 salary increase** for every single DPS employee. This is a no-brainer.
why_es: Le costará al propietario promedio **$72 al año** y dará un **aumento salarial base de $1,750** a cada empleado de DPS. Es una decisión obvia.
