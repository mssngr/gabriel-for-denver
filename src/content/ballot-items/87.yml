title: Graduated Income Tax
title_es: Impuesto progresivo sobre la renta
section: amendments
order: 7
stance: 'yes'
what: Replaces flat income tax with a graduated tax. **It’s a tax cut** for everyone who makes less than $500k/yr. Tax increase for those above.
what_es: Reemplaza el impuesto fijo sobre la renta con un impuesto progresivo. **Es un recorte de impuestos** para todos los que ganan menos de $500 mil al año. Aumento de impuestos para quienes ganan más.
why: '**Raises state funds by $2.7 billion** a year while providing a tax cut for the working and middle class. So simple.'
why_es: '**Aumenta los fondos estatales en $2,700 millones** al año y a la vez da un recorte de impuestos a la clase trabajadora y media. Así de sencillo.'
