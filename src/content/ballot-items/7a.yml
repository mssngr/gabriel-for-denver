slug: 7a
code: 7A
title: Front Range Passenger Rail
title_es: Tren de pasajeros del Front Range
section: local
order: 7
stance: 'yes'
what: A 0.333% sales tax to raise almost $300 million for **Colorado Connector** which will run from Fort Collins to Pueblo, having stops in Denver at Union Station, the stadiums, and South Broadway.
what_es: Un impuesto sobre las ventas del 0.333% para recaudar casi $300 millones para el **Colorado Connector**, que irá de Fort Collins a Pueblo, con paradas en Denver en Union Station, los estadios y South Broadway.
why: Alternative to the often congested I-25, opening up travel all along the front range to those without cars, reducing 1,000 cars per day on the highway.
why_es: Una alternativa a la I-25, que suele estar congestionada, que abre los viajes a lo largo del Front Range a quienes no tienen auto y reduce 1,000 autos al día en la autopista.
