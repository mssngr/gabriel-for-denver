slug: '133'
code: '133'
title: Penalties for Human Trafficking
title_es: Penas por trata de personas
section: propositions
order: 3
stance: 'no'
what: Changes the penalty from a Class 2 Felony to a Class 1 Felony and institutes a mandatory minimum of life in prison without parole.
what_es: Cambia la pena de un delito grave de Clase 2 a un delito grave de Clase 1 e instituye una pena mínima obligatoria de cadena perpetua sin libertad condicional.
why: '**This will punish victims,** who are sometimes forced into aiding their captors. Also, this will target parents helping out-of-state children get gender-affirming or reproductive care.'
why_es: '**Esto castigará a las víctimas,** que a veces son obligadas a ayudar a sus captores. Además, esto apuntará contra los padres que ayudan a menores de otros estados a recibir atención de afirmación de género o reproductiva.'
status: published
