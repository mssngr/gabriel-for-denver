slug: '311'
code: '311'
title: Prohibit the Force-Feeding of Birds
title_es: Prohibir la alimentación forzada de aves
section: local
order: 5
stance: 'yes'
what: Citizen initiative to **ban force-feeding of birds** in Denver or the selling of products from it. May affect 15-24 restaurants. Fines between $1,000-$5,000.
what_es: Iniciativa ciudadana para **prohibir la alimentación forzada de aves** en Denver o la venta de productos derivados de ella. Podría afectar a 15-24 restaurantes. Multas de entre $1,000 y $5,000.
why: '**It’s incredibly cruel.** Force-feeding over 2 weeks that causes the liver to grow 10x its normal size. 10x more likely to die during that period before slaughter.'
why_es: '**Es increíblemente cruel.** Alimentación forzada durante 2 semanas que hace que el hígado crezca 10 veces su tamaño normal. 10 veces más probabilidades de morir durante ese período antes del sacrificio.'
status: published
