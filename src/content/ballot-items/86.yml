title: Congressional Redistricting
title_es: Redistribución de distritos del Congreso
section: amendments
order: 6
stance: 'no'
what: This adds rules around the drawing of congressional maps mid-decade, ensuring they don’t benefit one party or another.
what_es: Esto agrega reglas para trazar mapas del Congreso a mitad de década, asegurando que no beneficien a un partido u otro.
why: As Republican states redistrict in their favor, they want to ensure Democratic states cannot do the same.
why_es: Mientras los estados republicanos redistribuyen los distritos a su favor, quieren asegurarse de que los estados demócratas no puedan hacer lo mismo.
