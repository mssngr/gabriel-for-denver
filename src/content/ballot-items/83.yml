slug: '83'
code: '83'
title: Constitutional Right to Hunt & Fish
title_es: Derecho constitucional a cazar y pescar
section: amendments
order: 3
stance: 'no'
what: Creates a **constitutional right** to hunting and fishing by “traditional methods,” those being the preferred way of wildlife management.
what_es: Crea un **derecho constitucional** a cazar y pescar por “métodos tradicionales”, como la forma preferida de gestionar la vida silvestre.
why: Hunting and fishing are already legal. This would limit Colorado Parks and Wildlife’s role, invite litigation, and limit wildlife protections.
why_es: Cazar y pescar ya son legales. Esto limitaría el papel de Colorado Parks and Wildlife, invitaría a demandas y limitaría las protecciones de la vida silvestre.
status: published
