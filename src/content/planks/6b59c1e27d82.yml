commitment: Push for the opening of new family shelters in Denver.
commitment_es: Impulsar la apertura de nuevos refugios familiares en Denver.
why: 205 rooms for families in Denver shelters is not enough.
why_es: 205 habitaciones para familias en los refugios de Denver no son suficientes.
detail: Stable housing support for families in Denver is under-resourced while the need rapidly grows. In just 9 years, the child homeless population has multiplied by 5. We need more shelters specifically created for families.
detail_es: El apoyo de vivienda estable para las familias en Denver está desfinanciado mientras la necesidad crece rápidamente. En solo 9 años, la población infantil sin hogar se ha multiplicado por 5. Necesitamos más refugios creados específicamente para familias.
authority: Work with the Mayor on 2027's budget to include the creation of new family-focused homeless shelters.
authority_es: Trabajar con el alcalde en el presupuesto de 2027 para incluir la creación de nuevos refugios para personas sin hogar enfocados en las familias.
