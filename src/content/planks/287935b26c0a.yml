commitment: Present a resolution to establish intent for the funding of Denver's first city-owned grocery store.
commitment_es: Presentar una resolución para establecer la intención de financiar la primera tienda de comestibles de propiedad municipal en Denver.
why: People are leaving Denver, faster than they have in years. Affordability is why. Food costs are a key part of that.
why_es: La gente se está marchando de Denver más rápido de lo que lo ha hecho en años. La accesibilidad económica es la razón. Los costos de los alimentos son una parte fundamental de ello.
detail: |-
  “Anyone who has ever struggled with poverty knows how extremely **expensive** it is to be poor.” – James Baldwin

  Those on City Council may not know what it's like to actually go hungry. I have eaten ice to feel full when I couldn't afford food, multiple times. 1 in 6 Denverites have also skipped meals. Food costs account for half of many Denverites' wages.
detail_es: |-
  “Cualquiera que haya luchado alguna vez contra la pobreza sabe lo sumamente caro que es ser pobre.” – James Baldwin

  Quienes están en el Concejo Municipal tal vez no sepan lo que es pasar hambre de verdad. He comido hielo para sentirme lleno cuando no podía permitirme comprar comida, en múltiples ocasiones. 1 de cada 6 habitantes de Denver también se han saltado comidas. Los costos de los alimentos representan la mitad de los salarios de muchos denveritas.
authority: Vote on a resolution to establish intent to fund a city-owned grocery store. This is the first real step towards appropriating capital in the city budget in our strong mayoral system.
authority_es: Votar por una resolución para establecer la intención de financiar una tienda de comestibles de propiedad municipal. Este es el primer paso real hacia la asignación de capital en el presupuesto de la ciudad dentro de nuestro sistema de alcaldía fuerte.
timeline: day-one
