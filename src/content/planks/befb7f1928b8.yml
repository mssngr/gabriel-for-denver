guide: housing-for-all
slug: eviction-protection
order: 1
status: published
kicker: Eviction Protection
kicker_es: Protección contra Desalojos
pullQuote: Evictions are higher in Denver than they've ever been.
pullQuote_es: Los desalojos en Denver están más altos que nunca.
commitment: Expand right to counsel for evictions to all.
commitment_es: Ampliar el derecho a la asesoría legal en casos de desalojo para todos.
why: Legal counsel is expensive. Fighting landlords in court is out of reach for most.
why_es: La asesoría legal es costosa. Enfrentar a los propietarios en los tribunales está fuera del alcance de la mayoría.
detail: Evictions and affordability are two key reasons people end up unhoused. Stopping improper evictions in their tracks is a **first line of defense** for ensuring residents have a roof over their heads. Yet, legal counsel for fighting evictions is only guaranteed for low-income residents, leaving a large gap of middle-income Denverites who can't afford a lawyer. This can put them on a path towards homelessness.
detail_es: Los desalojos y la falta de asequibilidad son dos de las principales razones por las que las personas terminan sin hogar. Frenar los desalojos indebidos de inmediato es **la primera línea de defensa** para garantizar que los residentes tengan un techo sobre sus cabezas. Sin embargo, la asesoría legal para combatir los desalojos solo está garantizada para los residentes de bajos ingresos, lo que deja un gran vacío de denveritas de ingresos medios que no pueden pagar un abogado. Esto puede ponerlos en el camino hacia la indigencia.
authority: Amend the right-to-counsel ordinance to guarantee legal counsel for all facing evictions in court, regardless of income.
authority_es: Modificar la ordenanza del derecho a la asesoría legal para garantizar representación legal en los tribunales a todos los que enfrenten desalojos, sin importar sus ingresos.
timeline: ordinance
