detail: |-
  The ACLU report on Drones as First Responder programs warns that drones are increasingly dispatched not just to violent crimes but to minor nuisance calls, like loud music, a water leak, or someone bouncing a ball against a garage. This trend normalizes routine aerial surveillance of public and private spaces.

  Wired magazine did its own investigation and found that the public and private spaces most often being routinely surveilled were black and brown communities. AI drones entrench the disparities minority groups already face, every day, from law enforcement.
detail_es: |-
  El informe de la ACLU sobre los programas de drones como primeros respondedores advierte que los drones se desplazan cada vez más no solo a delitos violentos, sino a llamadas por molestias menores, como música alta, una fuga de agua o alguien rebotando un balón contra un garaje. Esta tendencia normaliza la vigilancia aérea rutinaria de espacios públicos y privados. 

  La revista Wired realizó su propia investigación y descubrió que los espacios públicos y privados más vigilados de forma rutinaria eran las comunidades de afrodescendientes y personas de color. Los drones con IA profundizan las disparidades que los grupos minoritarios ya enfrentan todos los días por parte de las fuerzas del orden.
authority: Vote on an ordinance to restrict AI drones from being used in Denver city limits, whether by governmental authorities or private citizens.
authority_es: Votar sobre una ordenanza para restringir el uso de drones con IA dentro de los límites de la ciudad de Denver, ya sea por autoridades gubernamentales o ciudadanos particulares.
