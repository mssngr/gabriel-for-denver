caption: of median income is the median income for a childcare worker in Denver.
caption_es: del ingreso medio es el ingreso mediano para un trabajador de cuidado infantil en Denver.
commitment: Ensure wage equity for all childcare workers.
commitment_es: Garantizar la equidad salarial para todos los trabajadores de guarderías y centros de cuidado infantil.
why: Expanding childcare without paying workers fairly would exploit an already vulnerable workforce.
why_es: Expandir el cuidado infantil sin pagar un salario justo a los trabajadores equivaldría a explotar a una fuerza laboral que ya de por sí es vulnerable.
detail: Childcare work is some of the lowest-valued labor, but produces some of the highest-value rewards for a city and society. Multnomah County in Oregon increased teacher base pay from $19.91/hr to $37/hr, increasing the workforce, dropping turnover, and improving quality. The return on investment is clear. We just need the willpower to do it.
detail_es: El trabajo de cuidado infantil es una de las labores menos valoradas, pero produce algunos de los beneficios de mayor valor para una ciudad y para la sociedad. El condado de Multnomah, en Oregón, aumentó el salario base de los maestros de $19.91 a $37 por hora, lo que incrementó la fuerza laboral, redujo la rotación de personal y mejoró la calidad. El rendimiento de la inversión es claro. Solo necesitamos la voluntad política para hacerlo.
authority: Ensure the Haynes-Gary Task Force for universal childcare includes worker and provider representatives. Also ensure that equitable pay remains a top priority of the commission.
authority_es: Asegurar que el Grupo de Trabajo Haynes-Gary para el cuidado infantil universal incluya a representantes de los trabajadores y proveedores. Asimismo, asegurar que la equidad salarial siga siendo una máxima prioridad de la comisión.
timeline: ongoing
