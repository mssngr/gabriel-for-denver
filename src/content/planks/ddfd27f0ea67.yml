kicker: Pre-K For All
kicker_es: Preescolar universal para todos
statValue: $17
caption: return for every $1 invested into preschool education.
caption_es: rendimiento por cada dólar invertido en la educación preescolar.
commitment: Make preschool free for all 3 & 4 year olds.
commitment_es: Hacer que el preescolar sea gratuito para todos los niños de 3 y 4 años.
why: Preschool is more expensive than food. Than housing. Yet study after study shows it improves outcomes.
why_es: El preescolar es más caro que la comida. Que la vivienda. Sin embargo, estudio tras estudio demuestra que mejora los resultados.
detail: |-
  The cost of preschool for families is often an **entire year's salary.** And Denver only provides for 4 year olds, often not enough for full-time.

  Washington D.C. implemented Universal Preschool and found it had a dramatic effect on the amount of families staying in city limits vs moving out to the suburbs. This strengthens the tax basis, making Pre-K For All an investment, not a handout.
detail_es: |-
  El costo del preescolar para las familias suele equivaler **al salario de todo un año.** Y Denver solo ofrece servicios para niños de 4 años, a menudo de manera insuficiente para cubrir el tiempo completo.

  Washington D.C. implementó el preescolar universal y descubrió que tuvo un impacto drástico en la cantidad de familias que se quedan dentro de los límites de la ciudad en lugar de mudarse a los suburbios. Esto fortalece la base impositiva, convirtiendo la iniciativa de preescolar universal para todos en una inversión, no en una limosna.
authority: Refer a ballot measure to Denver residents to approve increased funding to implement Pre-K For All. Given its broad support, it would be expected to pass.
authority_es: Turnar una iniciativa electoral a los residentes de Denver para aprobar un mayor financiamiento con el fin de implementar el preescolar universal para todos. Dado su amplio apoyo, se esperaría que sea aprobada.
timeline: ballot-referral
