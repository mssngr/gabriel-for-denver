guide: accountable-public-safety
slug: star-funding
order: 2
status: published
kicker: STAR Funding
kicker_es: Financiamiento STAR
statValue: 4.3x
caption: is how much more expensive it is for Denver Police to respond to a 9-1-1 call vs. STAR.
caption_es: es cuánto más costoso es para la Policía de Denver responder a una llamada al 9-1-1 en comparación con el programa STAR.
commitment: Increase STAR's funding with money from Denver Police's patrol budget.
commitment_es: Aumentar el financiamiento del programa STAR con dinero del presupuesto de patrullaje de la Policía de Denver.
why: With STAR handling more and more 9-1-1 calls, less budget is needed for traditional sworn officer responses.
why_es: Dado que el programa STAR atiende cada vez más llamadas al 9-1-1, se necesita un presupuesto menor para las respuestas de los agentes juramentados tradicionales.
detail: We spend $145 million per year on police patrols, in Denver, but only $6 million on the STAR program, despite the STAR program saving the city money for every call it takes. STAR also reduces the criminalization of poverty, focusing instead on providing services for those in need.
detail_es: Gastamos 145 millones de dólares al año en patrullajes policiales en Denver, pero solo 6 millones en el programa STAR, a pesar de que el programa STAR le ahorra dinero a la ciudad por cada llamada que atiende. STAR también reduce la criminalización de la pobreza, enfocándose en su lugar en proporcionar servicios a quienes los necesitan.
authority: Take $6 million from Denver's patrol budget (a drop in the bucket) and move it to the STAR program, doubling its funding and capacity.
authority_es: Tomar 6 millones de dólares del presupuesto de patrullaje de Denver (una gota en el océano) y destinarlos al programa STAR, duplicando su financiamiento y capacidad.
timeline: first-budget
