commitment: Institute an ordinance to ban homeless encampment sweeps.
commitment_es: Establecer una ordenanza para prohibir los operativos de desalojo de campamentos de personas sin hogar.
why: These sweeps solve no problems. They only create them.
why_es: Estos operativos no resuelven ningún problema. Solo los crean.
detail: A study by the Journal of Urban Health found that sweeps of unhoused encampments in Denver had **no effect** on reducing crime. Yet, our unhoused neighbors continue to face numerous discriminations and misconceptions.
detail_es: Un estudio del Journal of Urban Health descubrió que los operativos de desalojo de campamentos de personas sin hogar en Denver no tuvieron **ningún efecto** en la reducción de la delincuencia. Sin embargo, nuestros vecinos sin hogar continúan enfrentando numerosas discriminaciones y conceptos erróneos.
authority: Vote to abolish the practice of sweeping unhoused encampments in Denver, instead focusing efforts on providing housing and services to those in camps.
authority_es: Votar para abolir la práctica de desalojar los campamentos de personas sin hogar en Denver, enfocando en su lugar los esfuerzos en proporcionar vivienda y servicios a quienes se encuentran en los campamentos.
timeline: ordinance
