kicker: Zoning
kicker_es: Zonificación
statValue: 77%
statCaption: of Denver's residential land bans apartments, condos and townhomes outright.
statCaption_es: del suelo residencial de Denver prohíbe apartamentos, condominios y casas adosadas.
commitment: Legalize apartments, condos and townhomes on at least half of Denver's residential land.
commitment_es: Legalizar apartamentos, condominios y casas adosadas en al menos la mitad del suelo residencial de Denver.
why: Exclusionary zoning has racist origins. It still sets your rent.
why_es: La zonificación excluyente tiene orígenes racistas. Todavía fija tu alquiler.
detail: |-
  Upwards of 77% of Denver's residential areas prohibit the most affordable
  types of homes. Apartments, condos and townhomes are widely forbidden.

  Exclusionary zoning has racist origins, and the map it drew is still the map
  we live on. It is the single largest lever the city holds over the cost of a
  home.
detail_es: |-
  Más del 77% de las zonas residenciales de Denver prohíben los tipos de
  vivienda más asequibles. Los apartamentos, condominios y casas adosadas
  están ampliamente prohibidos.

  La zonificación excluyente tiene orígenes racistas, y el mapa que trazó
  sigue siendo el mapa en el que vivimos. Es la mayor palanca que tiene la
  ciudad sobre el costo de una vivienda.
authority: A zoning text amendment — a Council vote, no ballot measure required.
authority_es: Una enmienda al texto de zonificación — un voto del Concejo, sin necesidad de una medida electoral.
timeline: day-one
