commitment: Amend Blueprint Denver's map to allow for rezoning of exclusionary residential zones.
commitment_es: Modificar el mapa de Blueprint Denver para permitir la rezonificación de zonas residenciales exclusivas.
why: Single-family zoning has racist origins, meant to keep black and brown families out of "white" neighborhoods. The result has been a steadily increasing cost of housing for decades, resulting in our current crisis.
why_es: La zonificación unifamiliar tiene orígenes racistas, concebida para mantener a las familias negras y morenas fuera de los vecindarios «blancos». El resultado ha sido un aumento constante en el costo de la vivienda durante décadas, lo que ha derivado en nuestra crisis actual.
detail: |-
  Upwards of 77% of Denver's residential areas prohibit the most affordable types of homes. Apartments, condos and townhomes are widely forbidden.

  Exclusionary zoning has racist origins, and the map it drew is still the map we live in. It is the single largest lever the city holds over the cost of a home.
detail_es: |-
  Más del 77% de las zonas residenciales de Denver prohíben los tipos de vivienda más asequibles. Los apartamentos, condominios y casas adosadas están ampliamente prohibidos.

  La zonificación excluyente tiene orígenes racistas, y el mapa que trazó sigue siendo el mapa en el que vivimos. Es la mayor palanca que tiene la ciudad sobre el costo de una vivienda.
authority: |-
  Amend the map that legally controls what zonings can happen where, called the "Future Places" map from the Blueprint Denver plan.

  Once complete, rezonings of exclusionary residential areas can begin.
authority_es: |-
  Modificar el mapa que controla legalmente qué zonificaciones pueden llevarse a cabo en cada lugar, conocido como el mapa de «Lugares Futuros» del plan Blueprint Denver.

  Una vez completado, pueden comenzar las rezonificaciones de las áreas residenciales exclusivas.
