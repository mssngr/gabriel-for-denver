kicker: Parks That Feed Us
kicker_es: Parques Que Nos Alimentan
statValue: $25 million
caption: is roughly how much we spend, each year in Denver, to maintain our 3,000 acres of manicured grass.
caption_es: es aproximadamente lo que gastamos cada año en Denver para mantener nuestras 3,000 acres de césped cuidado.
commitment: Advocate for food forests and urban gardens in our parks.
commitment_es: Abogar por bosques comestibles y huertos urbanos en nuestros parques.
why: Across the world, gardens in parks have proven to connect neighbors better and to provide food for those in need.
why_es: En todo el mundo, los huertos en los parques han demostrado conectar mejor a los vecinos y proporcionar alimentos a quienes los necesitan.
detail: Giant swaths of Denver parks are massively under-utilized and over-budgeted. This is because of grass. **Grass is Denver's single most expensive asset.** Without spending a dime, we can re-route that money towards growing healthy food for Denverites.
detail_es: Grandes extensiones de los parques de Denver están masivamente subutilizadas y tienen un presupuesto excesivo. Esto se debe al césped. **El césped es el activo más costoso de Denver.** Sin gastar un solo centavo, podemos redirigir ese dinero hacia el cultivo de alimentos saludables para los denveritas.
authority: Work with Denver Parks and the city budget to shift priorities from grass maintenance to urban garden and food forest creation.
authority_es: Trabajar con Parques de Denver y el presupuesto de la ciudad para cambiar las prioridades del mantenimiento del césped a la creación de huertos urbanos y bosques comestibles.
timeline: first-budget
