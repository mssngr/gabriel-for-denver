kicker: Parks That Feed Us
kicker_es: Parques Que Nos Alimentan
statValue: $25,000,000
caption: is roughly how much we spend, each year in Denver, to maintain our 3,000 acres of manicured grass.
caption_es: es aproximadamente lo que gastamos cada año en Denver para mantener nuestras 3,000 acres de césped cuidado.
commitment: Advocate for food forests and urban gardens in our parks.
commitment_es: Abogar por bosques comestibles y huertos urbanos en nuestros parques.
why: Across the world, gardens in parks have proven to connect neighbors better and to provide food for those in need.
why_es: En todo el mundo, los huertos en los parques han demostrado conectar mejor a los vecinos y proporcionar alimentos a quienes los necesitan.
detail: |-
  2 out of 3 Denverites say that healthy food at grocery stores is too expensive. **Eating healthy shouldn't be a practice reserved for the wealthy.** It should be available to all. The food many of us eat is killing us. The system doesn't work.

  Meanwhile, giant swaths of Denver parks are massively under-utilized and over-budgeted. This is because of grass. Grass is Denver's single most expensive asset. Without spending a dime, we can re-route that money towards growing healthy food for Denverites.
detail_es: |-
  2 de cada 3 denveritas afirman que los alimentos saludables en los supermercados son demasiado caros. Comer sano no debería ser una práctica reservada para los ricos. Debería estar al alcance de todos. La comida que muchos de nosotros consumimos nos está matando. El sistema no funciona.

  Mientras tanto, grandes extensiones de los parques de Denver están masivamente subutilizadas y tienen un presupuesto excesivo. Esto se debe al césped. El césped es el activo más costoso de Denver. Sin gastar un solo centavo, podemos redirigir ese dinero hacia el cultivo de alimentos saludables para los denveritas.
authority: Denver already is piloting a universal basic food program, this year, and Denver Food Rescue provides 20 no-cost grocery programs across the city.
timeline: first-budget
