kicker: Vacancies
kicker_es: Vacantes
statValue: 34,000
statCaption: apartments sat empty at the end of 2025. We have the highest vacancy rate we've had in 16 years.
statCaption_es: los departamentos se quedaron vacíos a finales de 2025. Tenemos la tasa de vacantes más alta que hemos tenido en 16 años.
commitment: Fine owners leaving rental units vacant for 6 months, or longer.
commitment_es: Multar a los propietarios que dejen unidades de renta vacías durante 6 meses o más.
why: Landlords can afford to keep units vacant as they wait for renters with deeper pockets to come in. Fining vacancies has the natural consequence of lowering rent.
why_es: Los propietarios pueden darse el lujo de mantener las unidades vacías mientras esperan que lleguen inquilinos con bolsillos más profundos. Multar las vacantes tiene como consecuencia natural la baja de la renta.
detail: |-
  34,000 apartments sit empty in Denver, where we are seeing the highest vacancy rates we've seen in 16 years. Meanwhile, tenants still see their rents raised every year, and locals struggle to find apartments they can afford.

  Increased housing supply and reduced demand has had a positive effect on rent prices in Denver, but there is more we can do to ensure these vacancies are rented out to local Denverites instead of customers with deeper pockets that the landlords are waiting for.
detail_es: |-
  34,000 departamentos están vacíos en Denver, donde estamos viendo las tasas de vacantes más altas que hemos tenido en 16 años. Mientras tanto, los inquilinos siguen viendo cómo aumentan sus rentas cada año, y los locales batallan para encontrar departamentos que puedan pagar.

  El aumento en la oferta de vivienda y la reducción de la demanda han tenido un efecto positivo en los precios de la renta en Denver, pero hay más cosas que podemos hacer para garantizar que estas unidades vacías se renten a los habitantes locales de Denver en lugar de a clientes con bolsillos más profundos que los propietarios están esperando.
authority: Washington D.C., Berkley, Oakland, Melbourne, and Vancouver are just some examples of cities that have implemented vacancy taxes/fines. The current research on these efforts shows this is an often un-tapped lever cities can use to increase housing supply and increase city funding for affordable housing. It's not a silver bullet, but it is a tool in the tool belt.
authority_es: Washington D.C., Berkeley, Oakland, Melbourne y Vancouver son solo algunos ejemplos de ciudades que han implementado impuestos o multas por viviendas vacías similares. La investigación actual sobre estos esfuerzos muestra que se trata de una herramienta a menudo desaprovechada que las ciudades pueden utilizar para aumentar la oferta de vivienda y los fondos municipales destinados a la vivienda asequible. No es una solución mágica, pero sí es una herramienta más en el arsenal.
timeline: ordinance
