guide: housing-crisis
slug: inclusionary-thirty
order: 2
status: published
kicker: Affordability
kicker_es: Asequibilidad
statValue: 30%
statCaption: of all new housing, required to be affordable. Today the bar is about 10%.
statCaption_es: de toda la vivienda nueva, obligatoriamente asequible. Hoy el mínimo es cerca del 10%.
commitment: Raise the inclusionary requirement to 30% of all new housing.
commitment_es: Elevar el requisito de vivienda integradora al 30% de toda la vivienda nueva.
why: Roughly half of Denver falls below the median income the current 10% is measured against.
why_es: Aproximadamente la mitad de Denver está por debajo del ingreso medio con el que se mide el 10% actual.
detail: |-
  Companies come into Denver to build giant, luxury apartments that only
  benefit the wealthy and drive up rents for the rest of us. They are only
  required to provide about 10% of their housing as "affordable," and that is
  measured against median income — yet far more than 10% of Denverites fall
  below it.

  The Denver housing supply should be built for Denver residents, not wealthy
  outsiders.
detail_es: |-
  Empresas vienen a Denver a construir apartamentos gigantes y de lujo que
  solo benefician a los ricos y suben los alquileres para el resto de
  nosotros. Solo se les exige que cerca del 10% de sus viviendas sean
  "asequibles," y eso se mide con el ingreso medio — sin embargo, muchos más
  del 10% de los habitantes de Denver están por debajo de él.

  La oferta de vivienda de Denver debería construirse para los residentes de
  Denver, no para forasteros adinerados.
authority: An amendment to the inclusionary housing ordinance — a Council vote.
authority_es: Una enmienda a la ordenanza de vivienda integradora — un voto del Concejo.
timeline: ordinance
