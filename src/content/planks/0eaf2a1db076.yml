kicker: No Cost Groceries
kicker_es: Alimentos Sin Costo
statValue: 2 in 3
caption: Denverites say that healthy food at grocery stores is too expensive.
caption_es: los denveritas afirman que los alimentos saludables en los supermercados son demasiado caros.
commitment: Create a budget line item for no-cost groceries for all who need it.
commitment_es: Crear una partida presupuestaria para alimentos sin costo para todos los que los necesiten.
why: Eating healthy shouldn't be a practice reserved for the rich.
why_es: Comer sano no debería ser una práctica reservada para los ricos.
detail: 2 out of 3 Denverites say that healthy food at grocery stores is too expensive. **Eating healthy shouldn't be a practice reserved for the wealthy.** It should be available to all. The food many of us eat is killing us. The system doesn't work.
detail_es: 2 de cada 3 denveritas afirman que los alimentos saludables en los supermercados son demasiado caros. **Comer sano no debería ser una práctica reservada para los ricos.** Debería estar al alcance de todos. La comida que muchos de nosotros consumimos nos está matando. El sistema no funciona.
authority: Denver is already piloting a universal basic food program, this year, and Denver Food Rescue provides 20 no-cost grocery programs across the city. On city council, I can advocate for a dedicated budget line item, like Seattle has done, to expand basic food access for all.
authority_es: Denver ya está poniendo a prueba un programa de alimentos básicos universales este año, y Denver Food Rescue ofrece 20 programas de comestibles sin costo en toda la ciudad. En el concejo municipal, puedo abogar por una partida presupuestaria dedicada, como lo ha hecho Seattle, para ampliar el acceso a alimentos básicos para todos.
timeline: first-budget
