guide: affordable-housing
slug: co-living
order: 1
status: draft
kicker: Co-living
kicker_es: Co-vivienda
pullQuote: One third to one half of all urban dwellers used to live in "congregational housing" until it was banned in 1956 in Denver.
pullQuote_es: Entre un tercio y la mitad de todos los habitantes urbanos solían vivir en «vivienda congregacional» hasta que se prohibió en 1956 en Denver.
commitment: Legalize congregational housing in Denver.
commitment_es: Legalizar la vivienda congregacional en Denver.
why: This extremely affordable style of living was utilized by thousands of Denverites for almost a hundred years, until restrictive zoning laws forced residents onto the streets.
why_es: Este estilo de vida sumamente asequible fue utilizado por miles de habitantes de Denver durante casi cien años, hasta que las leyes de zonificación restrictivas obligaron a los residentes a irse a las calles.
detail: |-
  Congregational housing, today more commonly called "co-living," is where you rent a single room in a house or building with shared bathrooms and shared kitchens. Think dormitories. Before 1956, some estimates put almost half of urbanites in Denver lived in housing like this.

  LoDo, now one of the most expensive places to live in Denver, used to be a source of very affordable housing with several boarding houses, residential hotels, and other forms of co-living. In 1956, these buildings were torn down, and expensive housing and office buildings took their place.
detail_es: |-
  La vivienda congregacional, hoy llamada más comúnmente «co-vivienda» (o \*coliving\*), es donde rentas una sola habitación en una casa o edificio con baños y cocinas compartidos. Piensa en los dormitorios estudiantiles. Antes de 1956, algunas estimaciones señalan que casi la mitad de los habitantes urbanos de Denver vivían en viviendas de este tipo.

  LoDo, que ahora es uno de los lugares más caros para vivir en Denver, solía ser una fuente de vivienda sumamente asequible con varias casas de huéspedes, hoteles residenciales y otras formas de co-vivienda. En 1956, estos edificios fueron demolidos y en su lugar se construyeron viviendas caras y edificios de oficinas.
authority: A simple amendment to the zoning text, requiring a simple council vote. No ballot measure or even official rezoning required.
authority_es: Una simple modificación al texto de zonificación, que requiere una votación simple del consejo. Sin necesidad de una boleta electoral ni de una rezonificación oficial.
timeline: day-one
