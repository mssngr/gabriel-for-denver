kicker: AI Surveillance
kicker_es: Vigilancia de IA
pullQuote: “You can't get a breath of fresh air in or out of that place without us knowing.”
pullQuote_es: «No puedes ni respirar aire fresco para entrar o salir de ese lugar sin que nosotros lo sepamos».
caption: A Denver Police Officer
caption_es: Un oficial de la policía de Denver
commitment: Vote to end Denver's contract with Axon, the provider of these AI license plate readers.
commitment_es: Votar para poner fin al contrato de Denver con Axon, el proveedor de estos lectores de placas con inteligencia artificial.
why: AI-powered surveillance is turning Denver into a digital police state.
why_es: La vigilancia impulsada por IA está convirtiendo a Denver en un estado policial digital.
detail: Warrantless AI surveillance of drivers' daily movements by automatic license plate readers throughout Denver is unconstitutional. Taxpayer money is going directly to violating our inalienable rights. We expect this from the president, but not from our mayor.
detail_es: La vigilancia automatizada de los movimientos diarios de los conductores por parte de lectores automáticos de placas en todo Denver sin una orden judicial es inconstitucional. El dinero de los contribuyentes se destina directamente a violar nuestros derechos inalienables. Esperamos esto del presidente, pero no de nuestro alcalde.
authority: Issue an ordinance banning automatic license plate readers from tracking Denver drivers' movements through the city without specific judicial warrants.
authority_es: Emitir una ordenanza que prohíba que los lectores automáticos de placas rastreen los movimientos de los conductores en Denver a través de la ciudad sin órdenes judiciales específicas.
timeline: ordinance
