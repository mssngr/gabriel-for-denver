kicker_es: Cuidado de Infantes y Niños Pequeños
statValue: 20%
caption: reduction in available infant & toddler care when Free Pre-K is implemented alone.
caption_es: reducción en la disponibilidad de cuidado para infantes y niños pequeños cuando el preescolar gratuito se implementa de forma aislada.
commitment: Introduce a ballot measure to stabilize infant & toddler care in Denver.
commitment_es: Presentar una iniciativa electoral para estabilizar el cuidado de infantes y niños pequeños en Denver.
why: Pre-K For All is great, but can increase costs for infant & toddler care if done in isolation.
why_es: El preescolar universal para todos es excelente, pero puede aumentar los costos del cuidado de infantes y niños pequeños si se implementa de manera aislada.
detail: |-
  Cities across the US & Canada have found that if they implement Preschool For All without finding some way to support infant & toddler care centers, those centers simply close.

  Infant care is some of the most expensive to provide, and most day care centers lose money on it, every month. Normally, this cost is offset by revenue from the preschool age children. With Preschool For All making that free, childcare centers are left with little other options than raise prices or close.
detail_es: |-
  Ciudades de todo Estados Unidos y Canadá han descubierto que si implementan el preescolar universal sin encontrar alguna manera de apoyar a los centros de cuidado para infantes y niños pequeños, dichos centros simplemente cierran.

  El cuidado de bebés es uno de los servicios más costosos de ofrecer, y la mayoría de las guarderías pierden dinero en ello mes con mes. Normalmente, este costo se compensa con los ingresos de los niños en edad preescolar. Dado que el preescolar universal hace que eso sea gratuito, a los centros de cuidado infantil no les queda más opción que subir los precios o cerrar.
authority: After securing funding for Pre-K For All, City Council can refer a ballot measure to shift DPP's previous preschool tuition credits to infant & toddler tuition credits. No extra money needed, just shifting how it's used.
authority_es: Tras asegurar el financiamiento para el preescolar universal para todos, el Concejo Municipal puede remitir una iniciativa electoral para redirigir los créditos anteriores de matrícula preescolar del Programa de Preescolar de Denver (DPP) hacia créditos de matrícula para infantes y niños pequeños. No se necesita dinero adicional, solo reasignar su uso.
timeline: ballot-referral
