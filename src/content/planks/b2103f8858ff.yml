guide: accountable-public-safety
slug: police-misconduct
order: 0
status: published
kicker: Police Misconduct
kicker_es: Mala Conducta Policial
pullQuote: The police investigating the police is like you auditing your own taxes.
pullQuote_es: Que la policía investigue a la policía es como si tú mismo audituras tus impuestos.
caption: It doesn't work.
caption_es: No funciona.
commitment: Require that police misconduct is investigated by a citizen-ran body.
commitment_es: Exigir que la mala conducta policial sea investigada por un organismo dirigido por ciudadanos.
why: Misconduct is currently handled by the officer's supervisor in the form of “mandatory training.”
why_es: Actualmente, la mala conducta es manejada por el supervisor del oficial en forma de “capacitación obligatoria.”
detail: In the past year, Denver Police switched their process for misconduct from formal suspensions and reprimands to informal classroom trainings. Denver Police needs to be held accountable by outside third-parties.
detail_es: En el último año, la Policía de Denver cambió su proceso para la mala conducta de suspensiones y amonestaciones formales a capacitaciones informales en el aula. La Policía de Denver debe rendir cuentas ante terceros externos.
authority: Establish a city ordinance mandating outside oversight of misconduct for Denver Police.
authority_es: Establecer una ordenanza municipal que exija la supervisión externa de la mala conducta de la Policía de Denver.
timeline: ordinance
