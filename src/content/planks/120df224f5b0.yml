slug: end-non-violent-jailing
order: 1
status: published
kicker: End Non-Violent Jailing
kicker_es: Poner Fin al Encarcelamiento por Delitos No Violentos
pullQuote: Most people end up in jail for non-violent offenses.
pullQuote_es: La mayoría de las personas terminan en la cárcel por delitos no violentos.
commitment: Change the default punishments for non-violent offenses.
commitment_es: Cambiar los castigos predeterminados por delitos no violentos.
why: Non-violent jailing exists, today, as a pipeline for feeding undesirables to for-profit prisons for cheap labor and extortion.
why_es: El encarcelamiento por delitos no violentos existe hoy en día como un canal para abastecer de personas consideradas 'indeseables' a las prisiones con fines de lucro para obtener mano de obra barata y extorsión.
detail: |-
  Policing has deep roots in the slave catchers of the antebellum South. Private prisons, today, are an extension of that system, incarcerating “undesirables” like minorities and the unhoused for cheap labor and extortion.

  Meanwhile, the crimes that get them there are simple drug charges, public disorderliness, property damage, or mental health episodes. Nothing that we need to remove them from society for.
detail_es: |-
  La labor policial tiene raíces profundas en los cazadores de esclavos del Sur esclavista de la época anterior a la guerra civil. Las prisiones privadas de hoy son una extensión de ese sistema, que encarcela a “indeseables” como las minorías y las personas sin hogar para obtener mano de obra barata y extorsión.

  Mientras tanto, los delitos que los llevan allí son simples cargos por drogas, desorden público, daños a la propiedad o episodios de salud mental. Nada que requiera que los afastemos de la sociedad.
authority: Pass an ordinance to change the default sentencing for many non-violent offenses to things like citations, rehabilitation, probation, house arrest, and work release. The outcomes will be better, and Denver's budget can enjoy a smaller line item for manning our jails.
authority_es: Aprobar una ordenanza para cambiar la sentencia predeterminada por muchos delitos no violentos a medidas como multas y citaciones, rehabilitación, libertad condicional, arresto domiciliario y liberación por trabajo. Los resultados serán mejores, y el presupuesto de Denver podrá disfrutar de una partida menor para la operación de nuestras cárceles.
timeline: ordinance
