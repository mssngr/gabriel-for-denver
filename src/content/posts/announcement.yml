title: Announcement
title_es: Anuncio
slug: announcement
date: 2026-08-05
intro: "**I am not a lawyer.** I am not a career politician. I am not a pillar of business. I am someone you might've bumped into on the bus. And I care deeply about this city."
intro_es: '**No soy abogado.** No soy político de carrera. No soy un pilar del mundo empresarial. Soy alguien con quien quizás te hayas cruzado en el camión. Y me importa profundamente esta ciudad.'
content: |-
  30 years ago, my father woke up at 4am, every day as a postman, to deliver the mail to our neighbors. 10 years ago, I woke up at 4am, every day as a school bus driver, to deliver my neighbor's kids safely to school. Today, I am getting ready to wake up, again, at 4am, every day. This time to deliver change for my neighbors.

  I am running for Denver City Council, At Large, Seat B.

  Our city has been looking to corporations to solve our problems of affordability, housing, and childcare. The free market has failed us, is failing us, will continue to fail us. **It is up to us to solve the problems capitalism was never incentivized to.**

  Rent won't become reasonable because the landlords decide it should be. Childcare won't become affordable from decreased demand. The hungry won't be fed out of the goodness of CEO's hearts.

  **Our city will become the city we've always dreamed of when we stand together and make it happen,** despite the CEO's objections. A city by the people, for the people, and of the people.

  Join me in reclaiming our city.
content_es: |-
  Hace 30 años, mi padre se despertaba a las 4 de la mañana, todos los días como cartero, para entregar el correo a nuestros vecinos. Hace 10 años, yo me despertaba a las 4 de la mañana, todos los días como chofer de camión escolar, para llevar seguros a la escuela a los hijos de mi vecino. Hoy, me estoy preparando para despertarme, de nuevo, a las 4 de la mañana, todos los días. Esta vez para entregarles cambio a mis vecinos.

  Me estoy postulando para el Consejo de la Ciudad de Denver, Escaño General, Posición B.

  Nuestra ciudad ha estado buscando que las corporaciones resuelvan nuestros problemas de asequibilidad, vivienda y cuidado infantil. El libre mercado nos ha fallado, nos está fallando, seguirá fallando. **Nos toca a nosotros resolver los problemas que el capitalismo nunca tuvo incentivos para resolver.**

  La renta no será razonable porque los dueños decidan que así sea. El cuidado infantil no será asequible por la disminución de la demanda. Los hambrientos no serán alimentados por la bondad de los corazones de los CEO.

  **Nuestra ciudad será la ciudad que siempre hemos soñado cuando nos unamos y la hagamos realidad,** a pesar de las objeciones de los CEO. Una ciudad del pueblo, para el pueblo y por el pueblo.

  Únete a mí para recuperar nuestra ciudad.
