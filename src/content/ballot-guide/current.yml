heading: Know your **ballot**
heading_es: Conoce tu **boleta**
intro: Every race and measure on a Denver ballot, how I’m voting on each, and why. Go down your ballot line by line with this page open.
intro_es: Cada contienda y medida de una boleta de Denver, cómo voy a votar en cada una y por qué. Recorre tu boleta línea por línea con esta página abierta.
electionDate: 2026-11-03
mailByDate: 2026-10-24
